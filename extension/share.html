<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let 'Em Cookie</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;background:#f8eedd;color:#2e1d10;margin:0;padding:24px}
main{max-width:680px;margin:10vh auto;text-align:center}
p.big{font:600 clamp(28px,5.5vw,44px)/1.25 Georgia,serif;margin:0 0 40px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{border:0;background:#2e1d10;color:#f8eedd;border-radius:999px;padding:14px 26px;cursor:pointer;font:600 16px system-ui,sans-serif}
button.ghost{background:none;border:1.5px solid #2e1d10;color:#2e1d10}
p.hint{min-height:1.5em;margin:26px 0 0;color:#5a4128}
small{display:block;margin-top:44px;color:#755e48}
</style>
</head>
<body>
<main>
<p class="big">I hereby accept all cookies, forever. No need to ask me ever again. letemcookie.com</p>
<div class="row">
<button id="copy">Copy</button>
<button id="x" class="ghost">Share on X</button>
<button id="substack" class="ghost">Share as Substack note</button>
</div>
<p class="hint" id="hint"></p>
<small>A joke, not a legal certification.</small>
</main>
<script src="share.js"></script>
</body>
</html>
