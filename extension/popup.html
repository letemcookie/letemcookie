<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let 'Em Cookie</title>
<style>
body{font:15px/1.45 system-ui,sans-serif;width:270px;margin:0;background:#fff9ee;color:#27221b}
main{padding:18px 20px 20px}
h1{font-size:20px;margin:0 0 6px}
p{margin:8px 0}
button{width:100%;border:0;background:#b65d15;color:#fff;border-radius:7px;padding:10px 13px;cursor:pointer;font:inherit;margin-top:10px}
label{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#71665a;margin-top:10px;cursor:pointer}
input{margin-top:2px}
small{display:block;color:#71665a;margin-top:12px}
</style>
</head>
<body>
<main>
<h1>Let 'Em Cookie</h1>
<p id="count">You have been saved 0 times.</p>
<button id="pick">Pick missed banner</button>
<label><input type="checkbox" id="report">Also open a GitHub report draft to review</label>
<small>Some banners escape. Point one out and we click only that.</small>
</main>
<script src="popup.js"></script>
</body>
</html>
